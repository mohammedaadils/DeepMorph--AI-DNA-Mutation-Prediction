<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepMorph AI — Create Account</title>
    <meta name="description" content="DeepMorph AI Genomic Analysis Platform — Create your clinician account">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <canvas id="dna-canvas"></canvas>

    <div class="login-container">
        <div class="login-card glass-card">
            <div class="login-logo">
                <div class="logo-helix">🧬</div>
                <h1>DeepMorph <span class="version-badge">AI</span></h1>
                <p class="login-subtitle">Create Your Account</p>
            </div>

            <form id="register-form" autocomplete="off">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Dr. John Smith" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="you@hospital.com" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Minimum 6 characters" required minlength="6">
                </div>

                <div id="register-error" class="error-msg" style="display:none;"></div>

                <button type="submit" class="primary-btn w-full" id="register-btn">
                    <span class="btn-text">Create Account</span>
                    <div class="btn-loader">
                        <div class="spinner-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                </button>
            </form>

            <div class="test-creds">
                <span class="creds-label">Already have an account?</span>
                <a href="/" style="color: var(--accent-blue); font-weight: 600;">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
